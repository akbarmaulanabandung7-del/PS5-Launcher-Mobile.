name: Build PS5 Launcher V2 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract V2 Project
        run: |
          unzip PS5LauncherMobile-V2-Project.zip -d project

      - name: Build Android APK
        run: |
          cd project
          gradle assembleDebug

      - name: Upload PS5 Launcher V2 APK
        uses: actions/upload-artifact@v4
        with:
          name: PS5-Launcher-Mobile-V2
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
